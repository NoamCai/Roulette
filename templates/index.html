<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La roue de la chance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="{{ url_for('static', filename='js/index.js') }}" defer></script>
    
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
    <body style="background-color: darkgreen;">
        <div class="position-relative min-vh-100 w-100 bg-dark text-light">

            <div class="bg-secondary p-3 rounded-3 shadow mb-3 text-center border border-light border-opacity-25" 
                style="width: 250px;">
                <span class="text-light d-block small text-uppercase">Cagnotte</span>
                <span class="text-warning fw-bold fs-2" id="montant-cagnotte">{{ cagnotteHtml }} €</span>
            </div>

            
        
            <form method="POST" action="/">
             <button type="submit" class="position-absolute btn btn-primary btn-lg shadow" 
                    style="bottom: 100px; right: 50px;">
                cagnotter</button>

                <button id="btn-cagnotter" class="position-absolute btn btn-primary btn-lg shadow" 
                    style="bottom: 100px; right: 200px;">
                Cagnotter 2 JS</button>



                <button id="btn-cagnotter" class="position-absolute btn btn-primary btn-lg shadow" 
                hx-get="/api/cagnotter2?montant=10&devise=euro" 
            hx-target="#montant-cagnotte"
                        style="bottom: 100px; right: 400px;">
                Cagnotter 3</button>
            </form>
         </div>
    </body>
</html>
