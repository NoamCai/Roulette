<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La roue de la chance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="{{ url_for('static', filename='js/index.js') }}" defer></script>
    
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
    <body style="background-color: darkgreen;">
        <div class="position-relative min-vh-100 w-100 bg-dark text-light">

            <div class="bg-secondary p-3 rounded-3 shadow mb-3 text-center border border-light border-opacity-25" 
                style="width: 250px;">
                <span class="text-light d-block small text-uppercase">Cagnotte</span>
                <span class="text-warning fw-bold fs-2" id="montant-cagnotte">{{ cagnotteHtml }} €</span>
            </div>

            
        
        
             <button type="submit" class="position-absolute btn btn-primary btn-lg shadow" 
                    style="bottom: 100px; right: 50px;">
                cagnotter</button>

                <button id="btn-cagnotter" class="position-absolute btn btn-primary btn-lg shadow" 
                    style="bottom: 100px; right: 200px;">
                Cagnotter 2</button>



               

        <div class="input-group position-absolute shadow" style="bottom: 100px; right: 400px; width: 300px;">
    
            <input type="number" 
                name="montant" 
                id="montant-saisie"
                class="form-control bg-dark text-light border-secondary" 
                placeholder="Montant" 
                min="1" 
                value="10">

            <button class="btn btn-primary" 
                    type="button"
                    hx-get="/api/cagnotter2?devise=euro" 
                    hx-include="#montant-saisie"
                    hx-target="#montant-cagnotte">
                Créditer
            </button>
            <h1>Roulette</h1>

<button onclick="lancer()">Lancer la roulette</button>

<h2 id="resultat">-</h2>

<script>
function lancer() {
    fetch("/api/tirage")
        .then(res => res.json())
        .then(data => {
            document.getElementById("resultat").innerText =
                "Résultat : " + data.resultat;
        });
}
</script>

<div class="position-absolute form-check form-switch bg-secondary p-3 rounded-3 shadow" 
     style="bottom: 100px; right: 750px; width: 200px; padding-left: 3.5em;">
    
    <input class="form-check-input" 
           type="checkbox" 
           role="switch" 
           id="switch-pair-impair"
           name="type_mise"
           hx-get="/api/miser-type"
           hx-trigger="change"
           hx-target="#resultat-mise">
           
    <label class="form-check-label text-light fw-bold" for="switch-pair-impair">
        Pair (ON) / Impair
    </label>
</div>

<div id="resultat-mise" class="position-absolute text-info" style="bottom: 70px; right: 750px;"></div>



            
        </div>
    </body>
</html>
